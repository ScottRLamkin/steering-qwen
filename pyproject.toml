[project]
name = "steering-llms"
version = "0.1.0"
description = "Steer Qwen3.5 by pushing single MLP neuron directions into the residual stream."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    # CUDA-only extras: 4-bit quantization and Triton kernels. On macOS (MPS) the model
    # loads in bf16 and transformers falls back to its pure-torch linear-attention path.
    "bitsandbytes>=0.50.2; sys_platform != 'darwin'",
    "flash-linear-attention>=0.6.0; sys_platform != 'darwin'",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
]

[project.scripts]
steer = "steering_llms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab",
]
